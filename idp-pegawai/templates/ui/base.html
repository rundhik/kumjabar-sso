<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>{{ title|default('IDP Pegawai') }}</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}"><link rel="stylesheet" href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css"><script src="https://unpkg.com/gridjs/dist/gridjs.umd.js" defer></script></head>
<body class="app-body">
<header class="app-header"><div class="shell header-inner"><a class="brand" href="{{ url_for('ui.dashboard') }}"><span class="brand-mark">K</span><span><strong>IDP Pegawai</strong><small>Kumjabar SSO · Admin console</small></span></a><button class="nav-toggle" aria-label="Buka menu" onclick="document.body.classList.toggle('nav-open')">☰</button><nav class="app-nav" aria-label="Navigasi utama"><a href="{{ url_for('ui.dashboard') }}">Ringkasan</a><a href="{{ url_for('ui.pegawai') }}">Pegawai</a><a href="{{ url_for('ui.organisasi') }}">Organisasi</a><a href="{{ url_for('ui.import_page') }}">Import</a><a href="{{ url_for('ui.consumers') }}">Consumer</a></nav></div></header>
<main class="shell main-content">{% block content %}{% endblock %}</main>
<footer class="shell app-footer">IDP Pegawai <span>·</span> Kelola data identitas dengan aman dan transparan.</footer>
<script>document.querySelectorAll('.app-nav a').forEach(a=>{if(a.pathname===location.pathname)a.classList.add('active')});document.addEventListener('DOMContentLoaded',()=>{if(window.gridjs)return;document.querySelectorAll('.record-table').forEach(table=>{const wrap=table.closest('.overflow-x-auto');if(!wrap)return;const rows=[...table.tBodies[0].rows],size=10,state={q:'',page:1};const toolbar=document.createElement('div');toolbar.className='records-toolbar';toolbar.innerHTML='<div><h2>Daftar data</h2><p>Pencarian dan pagination tersedia.</p></div><div class="records-tools"><input class="records-search" type="search" placeholder="Cari data..." aria-label="Cari data"><button type="button" class="records-export">Ekspor CSV</button></div>';wrap.parentElement.insertBefore(toolbar,wrap);const render=()=>{const q=state.q.toLowerCase();const filtered=rows.filter(r=>r.textContent.toLowerCase().includes(q));const pages=Math.max(1,Math.ceil(filtered.length/size));state.page=Math.min(state.page,pages);rows.forEach(r=>r.style.display='none');filtered.slice((state.page-1)*size,state.page*size).forEach(r=>r.style.display='');let pager=toolbar.querySelector('.records-pager');if(!pager){pager=document.createElement('div');pager.className='records-pager';toolbar.appendChild(pager)}pager.innerHTML=`<span>${filtered.length} hasil · halaman ${state.page}/${pages}</span><button type="button" ${state.page<=1?'disabled':''}>Sebelumnya</button><button type="button" ${state.page>=pages?'disabled':''}>Berikutnya</button>`;pager.children[1].onclick=()=>{state.page--;render()};pager.children[2].onclick=()=>{state.page++;render()}};toolbar.querySelector('.records-search').oninput=e=>{state.q=e.target.value;state.page=1;render()};toolbar.querySelector('.records-export').onclick=()=>{const esc=v=>'"'+String(v).replaceAll('"','""')+'"';const csv=[[...table.querySelectorAll('thead th')].map(x=>x.textContent.trim()),...rows.map(r=>[...r.cells].map(c=>c.textContent.trim()))].map(r=>r.map(esc).join(',')).join('\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=table.dataset.exportName||'data.csv';a.click();URL.revokeObjectURL(a.href)};render()})});</script>
</body></html>
