[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kumjabar-sso"
version = "0.1.0"
description = "Kumjabar SSO identity provider"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4.0", "Flask-SQLAlchemy>=3.1,<4.0", "Alembic>=1.13,<2.0", "psycopg[binary]>=3.1,<4.0"]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring external service infrastructure",
    "postgresql: tests requiring PostgreSQL",
]

[tool.setuptools.packages.find]
where = ["src"]
