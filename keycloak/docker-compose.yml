services:
  kumjabar_keycloak:
    # Pin the server image for reproducible local rehearsals; update deliberately after release review.
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: kumjabar_keycloak
    command:
      - start-dev
      - --http-port=8080
      # Enable the standardized OAuth 2.0 token exchange feature for the
      # user-bound profile flow; permissions remain configured per client.
      - --features=token-exchange-standard:v2
    env_file:
      - ../idp-pegawai/.env
    environment:
      # Keycloak 26+ bootstrap variable names. These are Compose interpolation
      # values, so start this file with --env-file ../idp-pegawai/.env.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME wajib di ../idp-pegawai/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD wajib di ../idp-pegawai/.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${KEYCLOAK_DB_HOST:-global_postgresql}:${KEYCLOAK_DB_PORT:-5432}/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER wajib di ../idp-pegawai/.env}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD wajib di ../idp-pegawai/.env}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    networks:
      - project_network
    ports:
      - "8080:8080"
    restart: always

networks:
  project_network:
    external: true
